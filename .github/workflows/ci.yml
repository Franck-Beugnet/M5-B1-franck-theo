name: CI/CD Pyrenex Prod

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Tests API model (hors contract test)
        run: pytest -v services/model/tests -k "not model_contract_features_and_output"
      - name: Contract test du modele (gate release)
        run: pytest -v services/model/tests -k "model_contract_features_and_output"
      - name: Tests evaluation continue
        run: pytest -v tests/test_evaluation.py

  evaluate-model:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install evaluation deps
        run: pip install -r requirements-dev.txt
      - name: Evaluate model on reference set (gate)
        run: python scripts/evaluate_model.py --release-tag ci-${{ github.run_number }}
      - name: Degradation path smoke test (must fail)
        run: |
          set +e
          python scripts/evaluate_model.py --release-tag ci-degrade-${{ github.run_number }} --degrade
          CODE=$?
          set -e

          if [ "$CODE" -eq 0 ]; then
            echo "ERROR: --degrade should fail with non-zero exit code"
            exit 1
          fi

          echo "OK: --degrade failed as expected with exit code $CODE"

  build-model-image:
    needs: [tests, evaluate-model]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image model
        run: docker build -t pyrenex-model:ci ./services/model

  push-release-tag:
    needs: [tests, build-model-image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image with release tag
        env:
          RAW_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          REPOSITORY_LOWER="$(echo "$RAW_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPOSITORY_LOWER}-model"

          docker build -t "$IMAGE:$TAG" ./services/model
          docker push "$IMAGE:$TAG"
